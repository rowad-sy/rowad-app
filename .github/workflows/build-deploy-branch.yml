name: build-deploy-branch

# عند كل دمج في main: يبني الأصول (npm run build) ويدفع فرعًا باسم `deploy` = محتوى main + public/build الجاهز.
# السيرفر (Plesk ← Git) يسحب فرع deploy فقط، فلا حاجة لـ Node على السيرفر ولا لبناء يدوي.
# لا يلمس قاعدة البيانات ولا .env ولا أي أسرار؛ يستخدم GITHUB_TOKEN الافتراضي.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-deploy-branch
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # أسرار الرفع التلقائي (اختيارية): إن لم تُضبط يُتخطّى الرفع ويبقى فرع deploy فقط
    env:
      SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
      SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
      SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
      SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      APP_DIR: ${{ secrets.DEPLOY_APP_DIR }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install and build assets
        run: |
          npm ci
          npm run build
          test -f public/build/manifest.json

      - name: Publish deploy branch (main + public/build)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B deploy
          # public/build مُتجاهَل في .gitignore: نُدرجه بالقوة في هذا الفرع فقط
          git add -f public/build
          git commit -m "build assets for ${GITHUB_SHA::7}" 
          git push --force origin deploy

      # ───── رفع تلقائي لـ public/build إلى السيرفر (يعمل فقط إن ضُبطت الأسرار) ─────
      # يرفع إلى public/build_new ثم يبدّل المجلدين (الاحتفاظ بالقديم في build_old للتراجع) ويمسح كاش العروض.
      # لا يلمس الكود ولا قاعدة البيانات ولا .env.
      - name: Upload build to server
        if: env.SSH_HOST != '' && env.SSH_KEY != ''
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.SSH_HOST }}
          port: ${{ env.SSH_PORT || 22 }}
          username: ${{ env.SSH_USER }}
          key: ${{ env.SSH_KEY }}
          source: "public/build/*"
          target: "${{ env.APP_DIR || 'httpdocs' }}/public/build_new"
          strip_components: 2
          rm: true

      - name: Swap build and clear view cache
        if: env.SSH_HOST != '' && env.SSH_KEY != ''
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SSH_HOST }}
          port: ${{ env.SSH_PORT || 22 }}
          username: ${{ env.SSH_USER }}
          key: ${{ env.SSH_KEY }}
          script: |
            set -e
            cd "${{ env.APP_DIR || 'httpdocs' }}"
            test -f public/build_new/manifest.json
            rm -rf public/build_old
            [ -d public/build ] && mv public/build public/build_old
            mv public/build_new public/build
            php artisan view:clear
